<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Normalize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Font Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <title>AMOVA — Notícia</title>
    <link rel="shortcut icon" href="/img/AMOVA_logo_notext.png">

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/noticia.css">
</head>
<body>
    <div class="separator-line"></div>

    <!-- Botão Retornar (canto superior esquerdo) -->
    <button id="back-button" onclick="history.back()">&larr; Retornar</button>

    <article class="noticia">
        <img id="noticia-foto" class="noticia__foto" src="" alt="Imagem da notícia">
        <h1 id="noticia-manchete" class="noticia__manchete"></h1>
        <p id="noticia-data" class="noticia__data"></p>
        <p id="noticia-descricao" class="noticia__descricao"></p>
        <div class="noticia__divisor"></div>
        <p id="noticia-texto" class="noticia__texto"></p>

        <h2 id="noticia-galeria-titulo" class="noticia__galeria-titulo">Galeria de fotos</h2>
        <div id="noticia-galeria" class="noticia__galeria"></div>
    </article>

    <script src="/js/noticia.js"></script>
</body>
</html>
